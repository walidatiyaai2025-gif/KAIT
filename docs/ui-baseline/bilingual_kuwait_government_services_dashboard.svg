<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <style>
      .ar{font-family:Arial,'Noto Sans Arabic',sans-serif;font-weight:700;fill:#0b3560}.en{font-family:Arial,sans-serif;fill:#355c7d}.small{font-size:12px}.med{font-size:16px}.big{font-size:25px}.white{fill:#fff}.muted{fill:#7690aa}.card{fill:#fff;stroke:#dbe6f0;stroke-width:1}.shadow{filter:url(#s)}
    </style>
    <filter id="s"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#193b5c" flood-opacity=".12"/></filter>
    <linearGradient id="h" x1="0" x2="1"><stop stop-color="#0b4e78"/><stop offset="1" stop-color="#082f55"/></linearGradient>
  </defs>
  <rect width="1280" height="720" fill="#f4f8fc"/>
  <rect x="0" y="0" width="1280" height="72" fill="url(#h)"/>
  <rect x="1110" y="72" width="170" height="648" fill="#07345d"/>
  <line x1="1110" y1="72" x2="1110" y2="720" stroke="#17a6d9" stroke-width="4"/>
  <circle cx="1230" cy="34" r="25" fill="#fff" opacity=".96"/><text x="1230" y="39" text-anchor="middle" class="ar med">🇰🇼</text>
  <text x="1190" y="30" text-anchor="end" class="ar med white">بوابة تكامل الخدمات الحكومية</text><text x="1190" y="50" text-anchor="end" class="en small white">Government Services Integration Portal</text>
  <text x="640" y="29" text-anchor="middle" class="ar small white">معاً نحو كويت رقمية أكثر تقدماً</text><text x="640" y="49" text-anchor="middle" class="en small white">Towards a Smarter Digital Kuwait</text>
  <circle cx="54" cy="36" r="20" fill="#d7e7f3"/><text x="82" y="29" class="ar small white">أحمد محمد</text><text x="82" y="49" class="en small white">Ahmed Mohammed</text><text x="220" y="40" class="en small white">EN  |  AR</text>
  <!-- sidebar -->
  <g class="white" font-family="Arial" font-size="13" text-anchor="middle">
    <rect x="1120" y="88" width="150" height="55" rx="7" fill="#0b5f91"/><text x="1195" y="111" class="ar med white">الرئيسية</text><text x="1195" y="130" class="en small white">Home</text>
    <text x="1195" y="180" class="ar med white">الجهات</text><text x="1195" y="198" class="en small white">Entities</text>
    <text x="1195" y="245" class="ar med white">الخدمات</text><text x="1195" y="263" class="en small white">Services</text>
    <text x="1195" y="310" class="ar med white">الطلبات</text><text x="1195" y="328" class="en small white">Requests</text>
    <text x="1195" y="375" class="ar med white">سجل التدقيق</text><text x="1195" y="393" class="en small white">Audit Logs</text>
    <text x="1195" y="440" class="ar med white">الصلاحيات</text><text x="1195" y="458" class="en small white">Permissions</text>
    <text x="1195" y="505" class="ar med white">الإعدادات</text><text x="1195" y="523" class="en small white">Settings</text>
  </g>
  <!-- main title/search -->
