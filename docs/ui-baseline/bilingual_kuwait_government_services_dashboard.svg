  <rect x="785" y="94" width="280" height="47" rx="8" class="card"/><text x="1045" y="117" text-anchor="end" class="ar small muted">البحث عن جهة أو خدمة ...</text><text x="1045" y="134" text-anchor="end" class="en small muted">Search for an entity or service ...</text>
