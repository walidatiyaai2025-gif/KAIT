  <g class="shadow">
    <rect x="55" y="166" width="235" height="76" rx="8" class="card"/><circle cx="85" cy="204" r="22" fill="#fde5e5"/><text x="126" y="195" class="ar med">12</text><text x="126" y="216" class="en small">Failed Requests Today</text>
    <rect x="305" y="166" width="235" height="76" rx="8" class="card"/><circle cx="335" cy="204" r="22" fill="#e0f1ff"/><text x="376" y="195" class="ar med">156</text><text x="376" y="216" class="en small">Total Requests Today</text>
    <rect x="555" y="166" width="235" height="76" rx="8" class="card"/><circle cx="585" cy="204" r="22" fill="#dff8ee"/><text x="626" y="195" class="ar med">25</text><text x="626" y="216" class="en small">Active Services</text>
    <rect x="805" y="166" width="260" height="76" rx="8" class="card"/><circle cx="835" cy="204" r="22" fill="#fff1d9"/><text x="876" y="195" class="ar med">6</text><text x="876" y="216" class="en small">Active Entities</text>
  </g>
  <!-- entity card -->
  <rect x="55" y="260" width="1010" height="135" rx="10" class="card shadow"/><rect x="55" y="260" width="1010" height="4" fill="#c99a2e"/>
  <circle cx="125" cy="327" r="45" fill="#eef5fb" stroke="#d2dfeb"/><text x="125" y="334" text-anchor="middle" class="big">⚖</text>
  <text x="195" y="302" class="ar big">وزارة العدل</text><text x="195" y="328" class="en med">Ministry of Justice (MOJ)</text>
  <rect x="330" y="283" width="82" height="28" rx="14" fill="#dff5e5"/><text x="371" y="302" text-anchor="middle" class="ar small" fill="#16844d">مفعلة / Active</text>
  <text x="195" y="354" class="ar small">تاريخ الإنشاء: الثلاثاء، 8 سبتمبر 2026</text><text x="195" y="374" class="en small">Created On: Tuesday, September 8, 2026</text>
  <text x="650" y="310" class="ar small">خدمات إلكترونية متكاملة عبر واجهات برمجة التطبيقات بشكل آمن وموثوق.</text><text x="650" y="334" class="en small">Secure and reliable integration services through APIs.</text>
  <!-- services title -->
  <text x="55" y="435" class="ar big">خدمات وزارة العدل</text><text x="55" y="458" class="en med">Ministry of Justice Services</text>
  <!-- service cards -->
  <g class="shadow">
    <rect x="55" y="480" width="190" height="205" rx="9" class="card"/><text x="150" y="520" text-anchor="middle" class="big">☷</text><text x="150" y="550" text-anchor="middle" class="ar med">خدمة قضايا الزواج</text><text x="150" y="571" text-anchor="middle" class="en small">Marriage Cases Service</text><text x="150" y="600" text-anchor="middle" class="en small muted">API Key + Bearer</text><rect x="70" y="635" width="160" height="34" rx="6" fill="#0b4f7d"/><text x="150" y="657" text-anchor="middle" class="white small">Open Service</text>
    <rect x="257" y="480" width="190" height="205" rx="9" class="card"/><text x="352" y="520" text-anchor="middle" class="big">✓</text><text x="352" y="550" text-anchor="middle" class="ar med">التحقق من الحالة الاجتماعية</text><text x="352" y="571" text-anchor="middle" class="en small">Is Single Basic Service</text><text x="352" y="600" text-anchor="middle" class="en small muted">API Key + Bearer</text><rect x="272" y="635" width="160" height="34" rx="6" fill="#0b4f7d"/><text x="352" y="657" text-anchor="middle" class="white small">Open Service</text>
    <rect x="459" y="480" width="190" height="205" rx="9" class="card"/><text x="554" y="520" text-anchor="middle" class="big">◉</text><text x="554" y="550" text-anchor="middle" class="ar med">آخر قضية زواج للزوجين</text><text x="554" y="571" text-anchor="middle" class="en small">Marriage Couple Last Case</text><text x="554" y="600" text-anchor="middle" class="en small muted">API Key + Bearer</text><rect x="474" y="635" width="160" height="34" rx="6" fill="#0b4f7d"/><text x="554" y="657" text-anchor="middle" class="white small">Open Service</text>
    <rect x="661" y="480" width="190" height="205" rx="9" class="card"/><text x="756" y="520" text-anchor="middle" class="big">§</text><text x="756" y="550" text-anchor="middle" class="ar med">نص حكم الأسرة</text><text x="756" y="571" text-anchor="middle" class="en small">Family Judgment Text</text><text x="756" y="600" text-anchor="middle" class="en small muted">API Key + Bearer</text><rect x="676" y="635" width="160" height="34" rx="6" fill="#0b4f7d"/><text x="756" y="657" text-anchor="middle" class="white small">Open Service</text>
    <rect x="863" y="480" width="202" height="205" rx="9" class="card"/><text x="964" y="520" text-anchor="middle" class="big">▤</text><text x="964" y="550" text-anchor="middle" class="ar med">حالة الوكالة</text><text x="964" y="571" text-anchor="middle" class="en small">Procuration Status Service</text><text x="964" y="600" text-anchor="middle" class="en small muted">API Key + Bearer</text><rect x="878" y="635" width="172" height="34" rx="6" fill="#0b4f7d"/><text x="964" y="657" text-anchor="middle" class="white small">Open Service</text>
  </g>
