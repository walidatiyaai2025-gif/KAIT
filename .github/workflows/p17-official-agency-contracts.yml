name: P17 Official Agency Contracts

on:
  pull_request:
    paths:
      - 'src/GSIP.Infrastructure/Metadata/OfficialAgencyMetadataSeedService.cs'
      - 'src/GSIP.Infrastructure/Metadata/GreenGovernmentCatalogBootstrapService.cs'
      - 'src/GSIP.Infrastructure/Execution/TokenEndpointContractMetadata.cs'
      - 'docs/MOH_UAT_CONTRACT_MATRIX.md'
      - 'docs/CSC_UAT_CONTRACT_MATRIX.md'
      - 'scripts/verify_p17_official_agency_contracts.py'
      - 'tests/GSIP.P17OfficialAgencyContractChecks/**'
      - '.github/workflows/p17-official-agency-contracts.yml'
  push:
    branches: [ main ]
    paths:
      - 'src/GSIP.Infrastructure/Metadata/OfficialAgencyMetadataSeedService.cs'
      - 'src/GSIP.Infrastructure/Metadata/GreenGovernmentCatalogBootstrapService.cs'
      - 'src/GSIP.Infrastructure/Execution/TokenEndpointContractMetadata.cs'
      - 'docs/MOH_UAT_CONTRACT_MATRIX.md'
      - 'docs/CSC_UAT_CONTRACT_MATRIX.md'
      - 'scripts/verify_p17_official_agency_contracts.py'
      - 'tests/GSIP.P17OfficialAgencyContractChecks/**'
      - '.github/workflows/p17-official-agency-contracts.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Static contract verification
        run: python3 scripts/verify_p17_official_agency_contracts.py
      - name: Restore solution
        run: dotnet restore GSIP.sln
      - name: Build solution
        run: dotnet build GSIP.sln -c Release --no-restore
      - name: Restore P17 contract checks
        run: dotnet restore tests/GSIP.P17OfficialAgencyContractChecks/GSIP.P17OfficialAgencyContractChecks.csproj
      - name: Run P17 contract checks
        run: dotnet run --project tests/GSIP.P17OfficialAgencyContractChecks/GSIP.P17OfficialAgencyContractChecks.csproj -c Release --no-restore
