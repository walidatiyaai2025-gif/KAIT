name: P17 Official Agency Contracts

on:
  pull_request:
    paths:
      - 'src/GSIP.Infrastructure/Metadata/OfficialAgencyMetadataSeedService.cs'
      - 'src/GSIP.Infrastructure/Metadata/GreenGovernmentCatalogBootstrapService.cs'
      - 'src/GSIP.Infrastructure/Execution/TokenEndpointContractMetadata.cs'
      - 'docs/MOH_UAT_CONTRACT_MATRIX.md'
      - 'docs/CSC_UAT_CONTRACT_MATRIX.md'
      - 'scripts/verify_p17_official_agency_contracts.py'
      - 'tests/GSIP.P17OfficialAgencyContractChecks/**'
      - '.github/workflows/p17-official-agency-contracts.yml'
  push:
    branches: [ main ]
    paths:
      - 'src/GSIP.Infrastructure/Metadata/OfficialAgencyMetadataSeedService.cs'
      - 'src/GSIP.Infrastructure/Metadata/GreenGovernmentCatalogBootstrapService.cs'
      - 'src/GSIP.Infrastructure/Execution/TokenEndpointContractMetadata.cs'
      - 'docs/MOH_UAT_CONTRACT_MATRIX.md'
      - 'docs/CSC_UAT_CONTRACT_MATRIX.md'
      - 'scripts/verify_p17_official_agency_contracts.py'
      - 'tests/GSIP.P17OfficialAgencyContractChecks/**'
      - '.github/workflows/p17-official-agency-contracts.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      GSIP_P17_SQL: 'Server=(localdb)\MSSQLLocalDB;Database=GSIP_P17_${{ github.run_id }}_${{ github.run_attempt }};Integrated Security=true;TrustServerCertificate=true;MultipleActiveResultSets=true'
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
      - name: Setup pinned .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Static contract verification
        run: python scripts/verify_p17_official_agency_contracts.py
      - name: Restore solution
        run: dotnet restore GSIP.sln
      - name: Restore P17 contract checks
        run: dotnet restore tests/GSIP.P17OfficialAgencyContractChecks/GSIP.P17OfficialAgencyContractChecks.csproj
      - name: Build solution Release
        run: dotnet build GSIP.sln -c Release --no-restore
      - name: Build P17 contract checks Release
        run: dotnet build tests/GSIP.P17OfficialAgencyContractChecks/GSIP.P17OfficialAgencyContractChecks.csproj -c Release --no-restore
      - name: Start SQL Server LocalDB
        shell: pwsh
        run: |
          sqllocaldb start MSSQLLocalDB
          sqllocaldb info MSSQLLocalDB
      - name: Run P17 official agency contract acceptance
        run: dotnet run --project tests/GSIP.P17OfficialAgencyContractChecks/GSIP.P17OfficialAgencyContractChecks.csproj -c Release --no-build
