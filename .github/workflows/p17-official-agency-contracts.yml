name: P17 Official Agency Contracts

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      CANDIDATE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      GSIP_P17_SQL: 'Server=(localdb)\MSSQLLocalDB;Database=GSIP_P17_${{ github.run_id }}_${{ github.run_attempt }};Integrated Security=true;TrustServerCertificate=true;MultipleActiveResultSets=true'
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
      - name: Assert exact candidate SHA
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:CANDIDATE_SHA) { throw "Exact candidate mismatch: expected=$env:CANDIDATE_SHA actual=$actual" }
          Write-Host "EXACT_CANDIDATE_SHA=$actual"
      - name: Setup pinned .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Static official-agency contract verification
        run: python scripts/verify_p17_official_agency_contracts.py
      - name: Static MOE contract verification
        run: python scripts/verify_p17_moe_contracts.py
      - name: Restore solution
        run: dotnet restore GSIP.sln
      - name: Restore P17 contract checks
        run: dotnet restore tests/GSIP.P17OfficialAgencyContractChecks/GSIP.P17OfficialAgencyContractChecks.csproj
      - name: Restore P17 Basic auth checks
        run: dotnet restore tests/GSIP.P17BasicAuthChecks/GSIP.P17BasicAuthChecks.csproj
      - name: Restore P17 MOE metadata checks
        run: dotnet restore tests/GSIP.P17MoeContractChecks/GSIP.P17MoeContractChecks.csproj
      - name: Restore P17 AuthProfile isolation checks
        run: dotnet restore tests/GSIP.P17AuthProfileIsolationChecks/GSIP.P17AuthProfileIsolationChecks.csproj
      - name: Build solution Release
        run: dotnet build GSIP.sln -c Release --no-restore
      - name: Build P17 contract checks Release
        run: dotnet build tests/GSIP.P17OfficialAgencyContractChecks/GSIP.P17OfficialAgencyContractChecks.csproj -c Release --no-restore
      - name: Build P17 Basic auth checks Release
        run: dotnet build tests/GSIP.P17BasicAuthChecks/GSIP.P17BasicAuthChecks.csproj -c Release --no-restore
      - name: Build P17 MOE metadata checks Release
        run: dotnet build tests/GSIP.P17MoeContractChecks/GSIP.P17MoeContractChecks.csproj -c Release --no-restore
      - name: Build P17 AuthProfile isolation checks Release
        run: dotnet build tests/GSIP.P17AuthProfileIsolationChecks/GSIP.P17AuthProfileIsolationChecks.csproj -c Release --no-restore
      - name: Run P17 Basic auth transport acceptance
        run: dotnet run --project tests/GSIP.P17BasicAuthChecks/GSIP.P17BasicAuthChecks.csproj -c Release --no-build
      - name: Start SQL Server LocalDB
        shell: pwsh
        run: |
          sqllocaldb start MSSQLLocalDB
          sqllocaldb info MSSQLLocalDB
      - name: Run P17 official agency contract acceptance
        run: dotnet run --project tests/GSIP.P17OfficialAgencyContractChecks/GSIP.P17OfficialAgencyContractChecks.csproj -c Release --no-build
      - name: Run P17 MOE metadata acceptance
        run: dotnet run --project tests/GSIP.P17MoeContractChecks/GSIP.P17MoeContractChecks.csproj -c Release --no-build
      - name: Run P17 AuthProfile environment-isolation acceptance
        run: dotnet run --project tests/GSIP.P17AuthProfileIsolationChecks/GSIP.P17AuthProfileIsolationChecks.csproj -c Release --no-build
      - name: Write exact-candidate P17 evidence manifest
        shell: pwsh
        run: |
          $evidence = Join-Path $PWD 'artifacts/p17-official-agency-contracts'
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          @(
            "CandidateSha=$env:CANDIDATE_SHA",
            'OfficialAgencyStatic=PASS',
            'MoeStatic=PASS',
            'BasicAuthTransport=PASS',
            'OfficialAgencyPersistence=PASS',
            'MoeMetadataPersistence=PASS',
            'AuthProfileCrossEnvironmentShare=REJECTED',
            'AuthProfileSameEnvironmentShare=PASS',
            'ProductionFallback=FORBIDDEN',
            'SecretMaterialSeeded=NO'
          ) | Set-Content -Path (Join-Path $evidence 'manifest.txt') -Encoding utf8
      - name: Upload exact-candidate P17 evidence
        uses: actions/upload-artifact@v4
        with:
          name: P17-Official-Agency-Contracts-${{ env.CANDIDATE_SHA }}
          path: artifacts/p17-official-agency-contracts/
          if-no-files-found: error
          retention-days: 30
