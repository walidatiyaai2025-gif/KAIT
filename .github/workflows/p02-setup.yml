name: P02 First-run Setup Wizard

on:
  push:
    branches:
      - main
      - 'worker/p02-*'
  pull_request:

permissions:
  contents: read

jobs:
  setup-wizard-acceptance:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pinned .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore GSIP.sln

      - name: Build Release
        run: dotnet build GSIP.sln --configuration Release --no-restore

      - name: Preserve P00 contracts
        run: dotnet run --project tests/GSIP.BaselineChecks/GSIP.BaselineChecks.csproj --configuration Release --no-build

      - name: Preserve P01 architecture and design contracts
        run: dotnet run --project tests/GSIP.P01Checks/GSIP.P01Checks.csproj --configuration Release --no-build

      - name: Start SQL Server LocalDB
        shell: pwsh
        run: |
          sqllocaldb start MSSQLLocalDB
          sqllocaldb info MSSQLLocalDB

      - name: Run P02 SQL/setup/security checks
        shell: pwsh
        env:
          GSIP_P02_SQL_SERVER: '(localdb)\MSSQLLocalDB'
        run: dotnet run --project tests/GSIP.P02Checks/GSIP.P02Checks.csproj --configuration Release --no-build

      - name: Run P02 first-run browser evidence
        shell: pwsh
        run: ./scripts/verify-p02-setup.ps1

      - name: Upload P02 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P02-Setup-Evidence-${{ github.sha }}
          path: artifacts/p02-setup/
          if-no-files-found: error
          retention-days: 30

  sql-authentication-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pinned .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Generate ephemeral SQL credential
        shell: bash
        run: |
          password="GsipP02!$(openssl rand -hex 16)Aa1"
          echo "::add-mask::$password"
          echo "GSIP_P02_SQL_PASSWORD=$password" >> "$GITHUB_ENV"

      - name: Start ephemeral SQL Server 2022
        shell: bash
        run: |
          docker run --name gsip-p02-sql \
            -e ACCEPT_EULA=Y \
            -e MSSQL_PID=Developer \
            -e MSSQL_SA_PASSWORD="$GSIP_P02_SQL_PASSWORD" \
            -p 1433:1433 \
            -d mcr.microsoft.com/mssql/server:2022-latest

      - name: Build dedicated SQL Authentication acceptance
        shell: bash
        run: |
          dotnet restore tests/GSIP.P02SqlAuthChecks/GSIP.P02SqlAuthChecks.csproj
          dotnet build tests/GSIP.P02SqlAuthChecks/GSIP.P02SqlAuthChecks.csproj --configuration Release --no-restore

      - name: Run SQL Authentication success and negative acceptance
        shell: bash
        env:
          GSIP_P02_SQL_SERVER: 'tcp:127.0.0.1,1433'
          GSIP_P02_SQL_USERNAME: 'sa'
        run: dotnet run --project tests/GSIP.P02SqlAuthChecks/GSIP.P02SqlAuthChecks.csproj --configuration Release --no-build

      - name: Remove ephemeral SQL Server
        if: always()
        shell: bash
        run: docker rm -f gsip-p02-sql >/dev/null 2>&1 || true
