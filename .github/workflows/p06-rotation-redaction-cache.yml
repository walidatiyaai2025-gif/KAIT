name: P06 Rotation Redaction Cache

on:
  push:
    branches:
      - main
      - 'worker/p06-rotation-redaction-cache'
  pull_request:

permissions:
  contents: read

jobs:
  rotation-redaction-cache:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CANDIDATE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
      - name: Assert exact candidate SHA
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:CANDIDATE_SHA) { throw "Exact candidate mismatch: expected=$env:CANDIDATE_SHA actual=$actual" }
      - name: Setup pinned .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore solution
        run: dotnet restore GSIP.sln
      - name: Restore P06 redaction/cache checks
        run: dotnet restore tests/GSIP.P06RotationRedactionChecks/GSIP.P06RotationRedactionChecks.csproj
      - name: Restore P06 rotation safety checks
        run: dotnet restore tests/GSIP.P06RotationRedactionChecks/RotationSafety/GSIP.P06RotationSafetyChecks.csproj
      - name: Build solution Release
        run: dotnet build GSIP.sln -c Release --no-restore
      - name: Build P06 redaction/cache checks Release
        run: dotnet build tests/GSIP.P06RotationRedactionChecks/GSIP.P06RotationRedactionChecks.csproj -c Release --no-restore
      - name: Build P06 rotation safety checks Release
        run: dotnet build tests/GSIP.P06RotationRedactionChecks/RotationSafety/GSIP.P06RotationSafetyChecks.csproj -c Release --no-restore
      - name: Run redaction, sentinel and token-cache identity checks
        run: dotnet run --project tests/GSIP.P06RotationRedactionChecks/GSIP.P06RotationRedactionChecks.csproj -c Release --no-build
      - name: Run rotation atomicity and isolation checks
        run: dotnet run --project tests/GSIP.P06RotationRedactionChecks/RotationSafety/GSIP.P06RotationSafetyChecks.csproj -c Release --no-build
      - name: Fail if sentinel plaintext entered evidence output
        shell: pwsh
        run: |
          $sentinels = @(
            'P06_SENTINEL_3A7F2D0C91E84B76A5D4_SECRET',
            'P06_ROTATION_SENTINEL_7D91A42F0BE14D0E'
          )
          $files = Get-ChildItem artifacts/p06-rotation-redaction-cache -File -Recurse
          foreach ($sentinel in $sentinels) {
            $hits = $files | Select-String -SimpleMatch $sentinel
            if ($hits) {
              throw 'Synthetic sentinel plaintext leaked into evidence output.'
            }
          }
      - name: Validate execution plan and governance
        run: python scripts/validate_execution_plan.py
      - name: Upload P06 rotation/redaction/cache evidence
        if: ${{ always() && github.event_name == 'push' }}
        uses: actions/upload-artifact@v4
        with:
          name: P06-Rotation-Redaction-Cache-Evidence-${{ env.CANDIDATE_SHA }}
          path: artifacts/p06-rotation-redaction-cache/
          if-no-files-found: error
          retention-days: 30