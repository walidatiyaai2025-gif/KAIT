name: Translation Completeness

on:
  push:
    branches:
      - main
      - 'worker/post-final-translation-convergence'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  bilingual-acceptance:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      CANDIDATE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
      - name: Assert exact candidate SHA
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:CANDIDATE_SHA) { throw "Exact candidate mismatch: expected=$env:CANDIDATE_SHA actual=$actual" }
          Write-Host "EXACT_CANDIDATE_SHA=$actual"
      - name: Setup pinned .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore and build Release
        run: |
          dotnet restore GSIP.sln
          dotnet build GSIP.sln -c Release --no-restore
      - name: Verify bilingual translation completeness
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/translation-completeness | Out-Null
          python scripts/verify_translation_completeness.py | Tee-Object -FilePath artifacts/translation-completeness/static-acceptance.txt
      - name: Preserve P13 accessibility contract
        run: python scripts/verify_p13_ui_accessibility.py
      - name: Preserve governance integrity
        run: python scripts/validate_execution_plan.py
      - name: Write exact-candidate manifest
        shell: pwsh
        run: |
          "CandidateSha=$env:CANDIDATE_SHA`nUnit=POST_FINAL::translation-convergence`nState=REGRESSION_ACCEPTANCE_CANDIDATE" | Set-Content artifacts/translation-completeness/manifest.txt
      - name: Upload translation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: Translation-Completeness-${{ env.CANDIDATE_SHA }}
          path: artifacts/translation-completeness/
          if-no-files-found: error
          retention-days: 30
