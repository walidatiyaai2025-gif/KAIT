name: P09 Marriage Couple Last Case Service

on:
  push:
    branches:
      - main
      - 'worker/p09-marriage-couple-last-case-*'
  pull_request:

permissions:
  contents: read

jobs:
  marriage-couple-last-case:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      GSIP_P09_COUPLE_SQL: 'Server=(localdb)\MSSQLLocalDB;Database=GSIP_P09_COUPLE_${{ github.run_id }}_${{ github.run_attempt }};Integrated Security=true;TrustServerCertificate=true;MultipleActiveResultSets=true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pinned .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore solution
        run: dotnet restore GSIP.sln
      - name: Restore P09 API130 checks
        run: dotnet restore tests/GSIP.P09MarriageCoupleLastCaseChecks/GSIP.P09MarriageCoupleLastCaseChecks.csproj
      - name: Build solution Release
        run: dotnet build GSIP.sln -c Release --no-restore
      - name: Build P09 API130 checks Release
        run: dotnet build tests/GSIP.P09MarriageCoupleLastCaseChecks/GSIP.P09MarriageCoupleLastCaseChecks.csproj -c Release --no-restore
      - name: Start SQL Server LocalDB
        shell: pwsh
        run: |
          sqllocaldb start MSSQLLocalDB
          sqllocaldb info MSSQLLocalDB
      - name: Run P09 API130 fail-closed acceptance
        run: dotnet run --project tests/GSIP.P09MarriageCoupleLastCaseChecks/GSIP.P09MarriageCoupleLastCaseChecks.csproj -c Release --no-build
      - name: Revalidate authoritative P09 contract snapshots
        run: python scripts/validate_p09_contract_snapshots.py
      - name: Validate execution plan and governance
        run: python scripts/validate_execution_plan.py
      - name: Upload P09 API130 evidence
        if: ${{ always() && github.event_name == 'push' }}
        uses: actions/upload-artifact@v4
        with:
          name: P09-Marriage-Couple-Last-Case-Evidence-${{ github.sha }}
          path: artifacts/p09-marriage-couple-last-case-evidence/
          if-no-files-found: error
          retention-days: 30
