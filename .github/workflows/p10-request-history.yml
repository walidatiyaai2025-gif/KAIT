name: P10 Request History and Exports

on:
  push:
    branches:
      - main
      - 'worker/p10-requests-history-exports'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-security-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CANDIDATE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
      - name: Assert exact candidate SHA
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Setup pinned .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore
        run: |
          dotnet restore GSIP.sln
          dotnet restore tests/GSIP.P10RequestHistoryChecks/GSIP.P10RequestHistoryChecks.csproj
      - name: Build Release
        run: |
          dotnet build GSIP.sln -c Release --no-restore
          dotnet build tests/GSIP.P10RequestHistoryChecks/GSIP.P10RequestHistoryChecks.csproj -c Release --no-restore
      - name: Run executable P10 negative acceptance
        run: dotnet run --project tests/GSIP.P10RequestHistoryChecks/GSIP.P10RequestHistoryChecks.csproj -c Release --no-build
      - name: Verify P10 security contract
        run: python scripts/verify-p10-request-history.py
      - name: Preserve P09 official contract evidence
        run: python scripts/validate_p09_contract_snapshots.py
      - name: Preserve planning integrity
        run: python scripts/validate_execution_plan.py

  localdb-scope-concurrency-export:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CANDIDATE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      GSIP_P10_SQL: 'Server=(localdb)\MSSQLLocalDB;Database=GSIP_P10_HISTORY_${{ github.run_id }}_${{ github.run_attempt }};Integrated Security=true;TrustServerCertificate=true;MultipleActiveResultSets=true'
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
      - name: Assert exact candidate SHA
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:CANDIDATE_SHA) { throw 'Exact candidate mismatch.' }
      - name: Setup pinned .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore LocalDB acceptance
        run: dotnet restore tests/GSIP.P10RequestHistoryIntegrationChecks/GSIP.P10RequestHistoryIntegrationChecks.csproj
      - name: Build LocalDB acceptance
        run: dotnet build tests/GSIP.P10RequestHistoryIntegrationChecks/GSIP.P10RequestHistoryIntegrationChecks.csproj -c Release --no-restore
      - name: Start SQL Server LocalDB
        shell: pwsh
        run: |
          sqllocaldb start MSSQLLocalDB
          sqllocaldb info MSSQLLocalDB
      - name: Run migration, scope, IDOR, export, concurrency and retention acceptance
        run: dotnet run --project tests/GSIP.P10RequestHistoryIntegrationChecks/GSIP.P10RequestHistoryIntegrationChecks.csproj -c Release --no-build
      - name: Preserve planning integrity
        run: python scripts/validate_execution_plan.py
