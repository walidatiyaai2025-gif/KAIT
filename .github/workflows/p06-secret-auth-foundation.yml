name: P06 Secret/Auth Foundation Core

on:
  push:
    branches:
      - 'worker/p06-secret-auth-foundation'
  pull_request:
    paths:
      - 'src/GSIP.Domain/Secrets/**'
      - 'src/GSIP.Application/Secrets/**'
      - 'src/GSIP.Infrastructure/Secrets/**'
      - 'src/GSIP.Infrastructure/Setup/GsipDbContext.cs'
      - 'src/GSIP.Infrastructure/Setup/Migrations/*SecretAuthFoundation.cs'
      - 'src/GSIP.Infrastructure/DependencyInjection.cs'
      - 'tests/GSIP.P06CoreChecks/**'
      - 'src/GSIP.Application/Security/SecretRotationSafety.cs'
      - 'src/GSIP.Application/Authentication/TokenCacheIdentity.cs'
      - '.github/workflows/p06-secret-auth-foundation.yml'

permissions:
  contents: read

jobs:
  secret-auth-foundation:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      GSIP_P06_SQL: 'Server=(localdb)\MSSQLLocalDB;Database=GSIP_P06_${{ github.run_id }}_${{ github.run_attempt }};Integrated Security=true;TrustServerCertificate=true;MultipleActiveResultSets=true'
      GSIP_P05_SQL: 'Server=(localdb)\MSSQLLocalDB;Database=GSIP_P05_REG_${{ github.run_id }}_${{ github.run_attempt }};Integrated Security=true;TrustServerCertificate=true;MultipleActiveResultSets=true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pinned .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore solution
        run: dotnet restore GSIP.sln
      - name: Restore P06 core checks
        run: dotnet restore tests/GSIP.P06CoreChecks/GSIP.P06CoreChecks.csproj
      - name: Restore merged rotation/redaction checks
        run: dotnet restore tests/GSIP.P06RotationRedactionChecks/GSIP.P06RotationRedactionChecks.csproj
      - name: Restore merged rotation safety checks
        run: dotnet restore tests/GSIP.P06RotationRedactionChecks/RotationSafety/GSIP.P06RotationSafetyChecks.csproj
      - name: Restore P05 regression checks
        run: dotnet restore tests/GSIP.P05Checks/GSIP.P05Checks.csproj
      - name: Release solution build
        run: dotnet build GSIP.sln --configuration Release --no-restore
      - name: Build P06 core checks
        run: dotnet build tests/GSIP.P06CoreChecks/GSIP.P06CoreChecks.csproj --configuration Release --no-restore
      - name: Build merged rotation/redaction checks
        run: dotnet build tests/GSIP.P06RotationRedactionChecks/GSIP.P06RotationRedactionChecks.csproj --configuration Release --no-restore
      - name: Build merged rotation safety checks
        run: dotnet build tests/GSIP.P06RotationRedactionChecks/RotationSafety/GSIP.P06RotationSafetyChecks.csproj --configuration Release --no-restore
      - name: Build P05 regression checks
        run: dotnet build tests/GSIP.P05Checks/GSIP.P05Checks.csproj --configuration Release --no-restore
      - name: Start SQL Server LocalDB
        shell: pwsh
        run: |
          sqllocaldb start MSSQLLocalDB
          sqllocaldb info MSSQLLocalDB
      - name: Run P06 scope, migration, CAS and atomicity checks
        run: dotnet run --project tests/GSIP.P06CoreChecks/GSIP.P06CoreChecks.csproj --configuration Release --no-build
      - name: Run merged redaction and cache-identity checks
        run: dotnet run --project tests/GSIP.P06RotationRedactionChecks/GSIP.P06RotationRedactionChecks.csproj --configuration Release --no-build
      - name: Run merged rotation coordinator checks
        run: dotnet run --project tests/GSIP.P06RotationRedactionChecks/RotationSafety/GSIP.P06RotationSafetyChecks.csproj --configuration Release --no-build
      - name: Run P05 metadata regression
        run: dotnet run --project tests/GSIP.P05Checks/GSIP.P05Checks.csproj --configuration Release --no-build
      - name: Validate execution plan and governance
        run: python scripts/validate_execution_plan.py
