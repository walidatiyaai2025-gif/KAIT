name: P07 Service Execution UI

on:
  push:
    branches:
      - 'worker/p07-service-execution-ui-parity'
      - 'worker/p07-execution-ui-runtime-wiring'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  execution-ui:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      CANDIDATE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
      - name: Assert exact candidate SHA
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:CANDIDATE_SHA) {
            throw "Exact candidate mismatch: expected=$env:CANDIDATE_SHA actual=$actual"
          }
          Write-Host "EXACT_CANDIDATE_SHA=$actual"
      - name: Setup pinned .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore solution
        run: dotnet restore GSIP.sln
      - name: Build solution Release
        run: dotnet build GSIP.sln -c Release --no-restore
      - name: Start SQL Server LocalDB
        shell: pwsh
        run: |
          sqllocaldb start MSSQLLocalDB
          sqllocaldb info MSSQLLocalDB
      - name: Verify bilingual responsive Service Execution runtime UI
        shell: pwsh
        run: ./scripts/verify-p07-execution-ui.ps1
      - name: Validate execution plan and governance
        run: python scripts/validate_execution_plan.py
      - name: Upload P07 Service Execution UI evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: P07-Execution-UI-Evidence-${{ env.CANDIDATE_SHA }}
          path: artifacts/p07-execution-ui-evidence/
          if-no-files-found: error
          retention-days: 30
