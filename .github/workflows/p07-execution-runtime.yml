name: P07 Generic Execution Runtime

on:
  push:
    branches:
      - 'worker/p07-generic-execution-runtime'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  generic-execution-runtime:
    runs-on: ubuntu-latest
    env:
      CANDIDATE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
      - name: Assert exact candidate SHA
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Set up .NET from global.json
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore solution
        run: dotnet restore GSIP.sln
      - name: Restore P07 runtime checks
        run: dotnet restore tests/GSIP.P07ExecutionRuntimeChecks/GSIP.P07ExecutionRuntimeChecks.csproj
      - name: Restore P07 security checks
        run: dotnet restore tests/GSIP.P07ExecutionSecurityChecks/GSIP.P07ExecutionSecurityChecks.csproj
      - name: Build solution Release
        run: dotnet build GSIP.sln -c Release --no-restore
      - name: Build P07 runtime checks Release
        run: dotnet build tests/GSIP.P07ExecutionRuntimeChecks/GSIP.P07ExecutionRuntimeChecks.csproj -c Release --no-restore
      - name: Build P07 security checks Release
        run: dotnet build tests/GSIP.P07ExecutionSecurityChecks/GSIP.P07ExecutionSecurityChecks.csproj -c Release --no-restore
      - name: Run generic execution runtime checks
        shell: bash
        run: |
          mkdir -p evidence
          dotnet run --project tests/GSIP.P07ExecutionRuntimeChecks/GSIP.P07ExecutionRuntimeChecks.csproj -c Release --no-build | tee evidence/runtime-checks.txt
      - name: Preserve fail-closed execution security checks
        run: dotnet run --project tests/GSIP.P07ExecutionSecurityChecks/GSIP.P07ExecutionSecurityChecks.csproj -c Release --no-build
      - name: Validate execution plan and governance
        run: python scripts/validate_execution_plan.py
      - name: Build sanitized runtime evidence manifest
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib
          p = pathlib.Path('evidence/runtime-checks.txt')
          data = p.read_bytes()
          manifest = {
              'CandidateSha': os.environ['CANDIDATE_SHA'],
              'RuntimeChecks': 'PASS',
              'FailClosedSecurityChecks': 'PASS',
              'Governance': 'PASS',
              'RuntimeOutputBytes': len(data),
              'RuntimeOutputSha256': hashlib.sha256(data).hexdigest(),
              'SyntheticOnly': True,
              'RealCredentials': False,
          }
          pathlib.Path('evidence/manifest.json').write_text(json.dumps(manifest, indent=2), encoding='utf-8')
          PY
          ! grep -RIE '(authorization:[[:space:]]*bearer|x-api-key[[:space:]]*[:=]|consumer-secret[[:space:]]*[:=]|password[[:space:]]*[:=])' evidence
      - name: Upload exact-candidate runtime evidence
        uses: actions/upload-artifact@v4
        with:
          name: P07-Generic-Execution-Runtime-${{ env.CANDIDATE_SHA }}
          path: evidence/
          if-no-files-found: error
