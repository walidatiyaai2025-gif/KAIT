name: P03 Account Security Policy

on:
  push:
    branches:
      - main
      - worker/p03-account-security-policy
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  account-security-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.400

      - name: Restore solution
        run: dotnet restore GSIP.sln

      - name: Build solution
        run: dotnet build GSIP.sln --configuration Release --no-restore

      - name: Run P03 account security policy checks
        run: dotnet run --project tests/GSIP.P03PolicyChecks/GSIP.P03PolicyChecks.csproj --configuration Release

      - name: Validate execution plan
        run: python scripts/validate_execution_plan.py
