name: P09 Marriage Cases Service

on:
  push:
    branches:
      - main
      - 'worker/p09-marriage-cases-*'
  pull_request:

permissions:
  contents: read

jobs:
  marriage-cases:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      CANDIDATE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      GSIP_P09_MARRIAGE_SQL: 'Server=(localdb)\MSSQLLocalDB;Database=GSIP_P09_MARRIAGE_${{ github.run_id }}_${{ github.run_attempt }};Integrated Security=true;TrustServerCertificate=true;MultipleActiveResultSets=true'
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
      - name: Assert exact candidate SHA
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:CANDIDATE_SHA) { throw "Exact candidate mismatch: expected=$env:CANDIDATE_SHA actual=$actual" }
      - name: Setup pinned .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore solution
        run: dotnet restore GSIP.sln
      - name: Restore P09 Marriage Cases checks
        run: dotnet restore tests/GSIP.P09MarriageCasesChecks/GSIP.P09MarriageCasesChecks.csproj
      - name: Build solution Release
        run: dotnet build GSIP.sln -c Release --no-restore
      - name: Build P09 Marriage Cases checks Release
        run: dotnet build tests/GSIP.P09MarriageCasesChecks/GSIP.P09MarriageCasesChecks.csproj -c Release --no-restore
      - name: Start SQL Server LocalDB
        shell: pwsh
        run: |
          sqllocaldb start MSSQLLocalDB
          sqllocaldb info MSSQLLocalDB
      - name: Run P09 Marriage Cases acceptance
        run: dotnet run --project tests/GSIP.P09MarriageCasesChecks/GSIP.P09MarriageCasesChecks.csproj -c Release --no-build
      - name: Revalidate authoritative P09 contract snapshots
        run: python scripts/validate_p09_contract_snapshots.py
      - name: Validate execution plan and governance
        run: python scripts/validate_execution_plan.py
      - name: Upload P09 Marriage Cases evidence
        if: ${{ always() && github.event_name == 'push' }}
        uses: actions/upload-artifact@v4
        with:
          name: P09-Marriage-Cases-Evidence-${{ env.CANDIDATE_SHA }}
          path: artifacts/p09-marriage-cases-evidence/
          if-no-files-found: error
          retention-days: 30
